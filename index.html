<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<!-- GitHub Pages cannot send security headers, so the policy lives here.
     Only this site's own files run; the one outside source is Google Fonts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="description" content="Jídelní lístek — vietnamská, thajská a japonská kuchyně. Ceny, popisy a alergeny.">
<title>Menu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<a class="skip-link" href="#obsah">Přeskočit na menu</a>

<header class="site-header">
  <span class="site-header__name"></span>
  <span class="site-header__tagline"></span>
  <span class="site-header__hours"></span>
</header>

<!-- Shown on a category page, hidden on the index. -->
<div class="bar" hidden>
  <a class="bar__back" href="#/"></a>
  <nav class="bar__nav" aria-label="Kategorie jídel"></nav>
</div>

<main class="main" id="obsah">

  <!-- The landing screen: one card per category. -->
  <nav class="index" aria-label="Kategorie jídel"></nav>

  <!-- Category sections are inserted here from data/menu.json -->

  <section class="allergens" id="alergeny" hidden>
    <h2 class="allergens__title"></h2>
    <p class="allergens__note"></p>
    <div class="allergens__grid"></div>
  </section>
</main>

<footer class="site-footer"></footer>

<button class="to-top" type="button" aria-label="Zpět nahoru"></button>

<script src="assets/js/app.js"></script>
</body>
</html>
